name: Build & publish image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (smoke test)
        run: |
          docker build -t interest-matrix:test .
          docker run -d --name im -p 8080:8080 interest-matrix:test
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "Interest Matrix"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags (GHCR needs a lowercase name)
        id: meta
        if: github.event_name == 'push'
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/interest-matrix"
          echo "tags=$IMG:latest,$IMG:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
